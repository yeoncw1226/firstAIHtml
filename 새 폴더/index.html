
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로또 번호 추천</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>🍀 로또 번호 추천</h1>
    <p class="description">
      행운의 번호 5세트를 생성해 보세요!
    </p>

    <button id="generate-button" type="button">
      🎲 번호 5세트 추천받기
    </button>

    <div id="results" aria-live="polite">
      <p>버튼을 눌러 번호를 추천받으세요.</p>
    </div>

    <p class="notice">
      ※ 추천 번호는 무작위이며 당첨을 보장하지 않습니다.
    </p>
  </div>

  <script src="script.js" defer></script>

</body>
</html>
